<!DOCTYPE html>
<html>
    <head><meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Apply Online | Bugema University Vocational School Uganda</title>
        <meta name="description" content="Apply online for Bugema University Vocational School in Uganda and start your training in practical, job-ready skills.">
        <meta name="robots" content="index, follow">
        <meta property="og:title" content="Apply Online | Bugema University Vocational School">
        <meta property="og:description" content="Begin your vocational training journey at Bugema University Vocational School in Uganda.">
        <meta property="og:type" content="website">
        <meta property="og:image" content="images/logo2.jpg">
        <meta name="twitter:card" content="summary_large_image">
        <link rel="canonical" href="https://bugemaunivoc.netlify.app/enroll.html">

        <style>
            * {
                box-sizing: border-box;
                font-family: Segoe UI;
            }
            body {
                margin: 0;
                background: #f6f8fc;
                padding: 15px;
            }
            .form-wrap {
                max-width: 500px;
                margin: 20px auto;
                background: white;
                border-radius: 14px;
                padding: 22px;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            }
            .form-wrap h2 {
                color: #003366;
                text-align: center;
                margin: 0 0 6px;
            }
            .sub {
                text-align: center;
                color: gray;
                font-size: 13px;
                margin-bottom: 18px;
            }
            label {
                font-size: 12px;
                font-weight: bold;
                color: #003366;
                margin-top: 12px;
                display: block;
            }
            input,
            select,
            textarea {
                width: 100%;
                padding: 5px;
                border: 1px solid #ddd;
                border-radius: 8px;
                margin-top: 5px;
                font-size: 14px;
            }
            input:focus,
            select:focus,
            textarea:focus {
                border-color: #004aad;
                outline: none;
            }
            .row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .error {
                font-size: 11px;
                color: red;
                display: none;
                margin-top: 3px;
            }
            .btn {
                width: 100%;
                background: #003366;
                color: white;
                border: none;
                padding: 8px;
                border-radius: 8px;
                font-size: 15px;
                margin-top: 18px;
                cursor: pointer;
                font-weight: bold;
            }
            .btn:disabled {
                opacity: 0.6;
            }
            .success {
                display: none;
                text-align: center;
                padding: 30px 20px;
            }
            .success h3 {
                color: green;
            }
            .badge {
                display: inline-block;
                background: rgb(224, 224, 88);
                color: #137333;
                padding: 4px 10px;
                border-radius: 20px;
                font-size: 15px;
                font-weight: bolder;
                margin-bottom: 10px;
            }
            @media (max-width: 600px) {
                .row {
                    grid-template-columns: 1fr;
                }
                body{
                    background: #e9f1f8;
                    padding: 12px;
                }
                .form-wrap {
                    margin: 12px auto;
                    padding: 18px;
                }
                input,
                select,
                textarea {
                    font-size: 16px;
                }
            }
        </style>
    </head>
    <body>
        

        <div class="form-wrap" id="formBox">
            <span class="badge">🎓 Admissions Open 2026</span>
            <h2>Bugema Vocational Enrollment Form</h2>
            <p class="sub">Excellence in Life</p>

            <label>Full Name *</label>
            <input id="name" placeholder="e.g. John Mukasa">
            <div class="error" id="e-name">Name required</div>

            <div class="row">
                <div>
                    <label>Phone (WhatsApp) *</label>
                    <input id="phone" placeholder="07XXXXXXXX" type="tel">
                    <div class="error" id="e-phone">Valid phone required</div>
                </div>
                <div>
                    <label>Email</label>
                    <input id="email" placeholder="john@gmail.com" type="email">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>District *</label>
                    <input id="district" placeholder="e.g. Luwero">
                    <div class="error" id="e-dist">Required</div>
                </div>
                <div>
                    <label>Education Level *</label>
                    <select id="education">
                        <option value="">Select</option>
                        <option>P7</option><option>S4</option><option>S6</option>
                    </select>
                    <div class="error" id="e-edu">Required</div>
                </div>
            </div>

            <label>Select Course *</label>
            <select id="course">
                <option value="">-- Choose Course --</option>
                <option value="ICT">Computer & ICT (Information Communication Technology)</option>
                <option value="Tailoring">Tailoring & Fashion </option>
                <option value="Electrical">Electrical Installation</option>
                <option value="Building">Building & Construction </option>
                <option value="Hair Dressing">Hair Dressing</option>
                 <option value="Accountacy">Accountacy</option>
                <option value="Carpentry">Carpenter</option>
                 <option value="Accountacy">Accountacy</option>
                <option value="Plumbing">Plumbing</option>
                 <option value="Driving">Driving</option>
                 <option value="">Agriculture</option>
            </select>
            <div class="error" id="e-course">Select course</div>

            <label>When to Start? *</label>
            <select id="intake">
                <option value="">Select intake</option>
                <option>January 2027</option>
                <option>May 2027</option>
                <option>September 2027</option>
            </select>
            <div class="error" id="e-intake">Required</div>

            <label>Why join this course? (optional)</label>
            <textarea id="reason" rows="3" placeholder="I want to start my own shop..."></textarea>

            <button class="btn" id="submitBtn" onclick="submitForm()">Submit Application →</button>
            <p style="font-size:11px; font-weight: bolder; text-align:center; color:black; margin-top:10px;">By submitting, you agree to Bugema admission terms. No fees online.</p>
        </div>

        <div class="form-wrap success" id="successBox">
            <h3>✅ Application Received!</h3>
            <p id="successMsg" style="font-size:14px; line-height:1.6;"></p>
            <button class="btn" style="background:#25D366;" onclick="sendWhatsApp()">Send to WhatsApp Admin</button>
            <button class="btn" style="background:white; color:#003366; border:1px solid #003366; margin-top:8px;"
             onclick="location.reload()">New Application</button>
        </div>

        <script>
            let lastData = {};
            function submitForm() {
                let ok = true;
                const fields = [
                    { id: "name", err: "e-name", check: (v) => v.length > 2 },
                    { id: "phone", err: "e-phone", check: (v) => v.length >= 10 },
                    { id: "district", err: "e-dist", check: (v) => v.length > 1 },
                    { id: "education", err: "e-edu", check: (v) => v !== "" },
                    { id: "course", err: "e-course", check: (v) => v !== "" },
                    { id: "intake", err: "e-intake", check: (v) => v !== "" },
                ];
                fields.forEach((f) => {
                    const val = document.getElementById(f.id).value.trim();
                    const err = document.getElementById(f.err);
                    if (!f.check(val)) {
                        err.style.display = "block";
                        ok = false;
                    } else {
                        err.style.display = "none";
                    }
                });
                if (!ok) return;

                lastData = {
                    name: document.getElementById("name").value,
                    phone: document.getElementById("phone").value,
                    email: document.getElementById("email").value,
                    district: document.getElementById("district").value,
                    education: document.getElementById("education").value,
                    course: document.getElementById("course").value,
                    intake: document.getElementById("intake").value,
                    reason: document.getElementById("reason").value,
                };

                // Save locally (for admin)
                const all = JSON.parse(localStorage.getItem("bugema_apps") || "[]");
                all.push({ ...lastData, date: new Date().toLocaleString() });
                localStorage.setItem("bugema_apps", JSON.stringify(all));

                document.getElementById("formBox").style.display = "none";
                document.getElementById("successBox").style.display = "block";
                document.getElementById("successMsg").innerHTML =
                    `Thank you <b>${lastData.name}</b> from <b>${lastData.district}</b>!<br>You applied for <b>${lastData.course}</b> - <b>${lastData.intake}</b> intake.<br><br>We will call you on <b>${lastData.phone}</b> within 24 hours.`;
                window.scrollTo(0, 0);
            }

            function sendWhatsApp() {
                const text = `NEW BUGEMA VOCATIONAL APPLICATION%0A%0AName: ${lastData.name}%0APhone: ${lastData.phone}%0ADistrict: ${lastData.district}%0ACourse: ${lastData.course}%0AIntake: ${lastData.intake}%0AEducation: ${lastData.education}%0AReason: ${lastData.reason}`;
                // Replace with your admin number
                const adminNumber = "256700000000";
                window.open(`https://wa.me/${adminNumber}?text=${text}`, "_blank");
            }
        </script>
        <script src="js/script.js"></script>
    </body>
</html>
